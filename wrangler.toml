name = "trip"
compatibility_date = "2024-09-23"
main = "_worker.js"
keep_vars = true

[[r2_buckets]]
binding = "trip_agents"
bucket_name = "trip-agents"

# Photo desk: cheap vision + planning on Workers AI (no third-party key).
[ai]
binding = "AI"

[[d1_databases]]
binding = "TRIP_DB"
database_name = "trip-registry"
database_id = "dc510a26-852a-4ae3-9602-d5ea442f981a"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "TRIPS_KV"
id = "e1a47846a214431885a6f62b4d7a938d"

[build]
command = "node scripts/build-production.mjs"

[vars]
SEARX_URL = "https://standing-encyclopedia-achievements-fibre.trycloudflare.com"
TRIP_STORE_REQUIRED = "d1"
